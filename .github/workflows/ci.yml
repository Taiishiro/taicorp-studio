name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint Python
  # ──────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Check engine/
        run: ruff check engine/

      - name: Check cartoon-factory/
        run: ruff check cartoon-factory/src cartoon-factory/tests

  # ──────────────────────────────────────────────
  # 2. Tests — les garanties que le README promet
  # ──────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install --quiet pytest

      # Volontairement sans claude-agent-sdk : les tests stubbent l'exécution des
      # agents, donc ils tournent sans clé API et sans brûler un seul token.
      - name: Run tests
        run: python -m pytest engine/tests -q

      # cartoon-factory : orchestrateur testé sans GPU (croquis Pillow + ffmpeg statique).
      - name: Install cartoon-factory deps
        run: pip install --quiet -e "cartoon-factory[dev,ffmpeg]"

      - name: Run cartoon-factory tests
        run: python -m pytest cartoon-factory/tests -q

  # ──────────────────────────────────────────────
  # 3. Build de l'image Docker
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t taicorp-studio:${{ github.sha }} .

  # ──────────────────────────────────────────────
  # 4. Déploiement — JAMAIS automatique en prod.
